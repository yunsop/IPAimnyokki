<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ipaimnyokki</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f9f9fb;
            color: #333;
        }
        h1 { font-size: 1.5rem; margin-bottom: 10px; }
        textarea {
            width: 100%;
            height: 120px;
            font-size: 1.5rem;
            padding: 12px;
            box-sizing: border-box;
            border: 2px solid #ccc;
            border-radius: 8px;
            margin-bottom: 10px;
            font-family: 'Lucida Sans Unicode', 'Arial Unicode MS', sans-serif;
        }
        textarea:focus { outline: none; border-color: #007add; }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button.action-btn {
            padding: 8px 16px;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: #007add;
            color: white;
        }
        button.action-btn:hover { background-color: #005fa3; }
        button.clear-btn { background-color: #e04f5f; }
        button.clear-btn:hover { background-color: #c03948; }
        .category { margin-bottom: 15px; }
        .category-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: #666;
            margin-bottom: 6px;
        }
        .key-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .ipa-key {
            width: 42px;
            height: 42px;
            font-size: 1.25rem;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.1s;
        }
        .ipa-key:hover { background: #eef6ff; border-color: #007add; }
        .ipa-key:active { background: #d0e5ff; }
    </style>
</head>
<body>

    <h1>IPA (국제음성기호) 입력기</h1>
    <textarea id="ipa-input" placeholder="..."></textarea>
    
    <div class="controls">
        <button class="action-btn" onclick="copyText()"> 복사하기</button>
        <button class="action-btn clear-btn" onclick="clearText()"> 지우기</button>
    </div>

    <div id="keyboard-container"></div>

    <script>
      
        const ipaData = {
            "모음 (Vowels)": [
                "i", "y", "ɨ", "ʉ", "ɯ", "u",
                "ɪ", "ʏ", "ʊ",
                "e", "ø", "ɘ", "ɵ", "ɤ", "o",
                "ə",
                "ɛ", "œ", "ɜ", "ɞ", "ʌ", "ɔ",
                "æ", "ɐ",
                "a", "ɶ", "ɑ", "ɒ"
            ],
            "자음 (Consonants)": [
                "p", "b", "t", "d", "ʈ", "ɖ", "c", "ɟ", "k", "g", "q", "ɢ", "ʔ",
                "m", "ɱ", "n", "ɳ", "ɲ", "ŋ", "ɴ",
                "ʙ", "r", "ʀ", "ⱱ", "ɾ", "ɽ",
                "ɸ", "β", "f", "v", "θ", "ð", "s", "z", "ʃ", "ʒ", "ʂ", "ʐ", "ç", "ʝ", "x", "ɣ", "χ", "ʁ", "ħ", "ʕ", "h", "ɦ",
                "ɬ", "ɮ", "ʋ", "ɹ", "ɻ", "j", "ɰ",
                "l", "ɭ", "ʎ", "ʟ", "w", "ʍ"
            ],
            "초분절음 및 기호 (Suprasegmentals)": [
                "ˈ", "ˌ", "ː", "ˑ", "̆", "|", "‖", ".", "‿", "̃", "ʰ", "ʷ", "ʲ", "ˠ", "ˤ", "̚"
            ]
        };

        const textarea = document.getElementById("ipa-input");
        const container = document.getElementById("keyboard-container");

        
        for (const [category, symbols] of Object.entries(ipaData)) {
            const catDiv = document.createElement("div");
            catDiv.className = "category";

            const title = document.createElement("div");
            title.className = "category-title";
            title.textContent = category;
            catDiv.appendChild(title);

            const grid = document.createElement("div");
            grid.className = "key-grid";

            symbols.forEach(symbol => {
                const btn = document.createElement("button");
                btn.className = "ipa-key";
                btn.textContent = symbol;
                btn.onclick = () => insertSymbol(symbol);
                grid.appendChild(btn);
            });

            catDiv.appendChild(grid);
            container.appendChild(catDiv);
        }

  
        function insertSymbol(symbol) {
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;

            textarea.value = text.substring(0, start) + symbol + text.substring(end);
            textarea.selectionStart = textarea.selectionEnd = start + symbol.length;
            textarea.focus();
        }

        function copyText() {
            if (!textarea.value) return;
            navigator.clipboard.writeText(textarea.value).then(() => {
                alert("copied: " + textarea.value);
            });
        }

        function clearText() {
            textarea.value = "";
            textarea.focus();
        }
    </script>
</body>
</html>
